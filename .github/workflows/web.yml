name: Publicar versão web

# Compila o Flutter para web e publica no GitHub Pages a cada push na branch main.
# Antes do primeiro uso: no repositório vá em Settings > Pages > Source e escolha "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # --base-href: o site fica em https://USUARIO.github.io/NOME-DO-REPOSITORIO/
      # --no-web-resources-cdn: embute o CanvasKit no site (o app abre offline depois da 1ª visita)
      - run: >
          flutter build web --release
          --base-href "/${{ github.event.repository.name }}/"
          --no-web-resources-cdn

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
