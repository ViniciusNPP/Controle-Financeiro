name: Publicar versão web

# Compila o Flutter para web e publica no GitHub Pages a cada push na branch main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: controle_financeiro
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-dependency-path: controle_financeiro/pubspec.lock

      - run: flutter pub get

      - run: >
          flutter build web --release
          --base-href "/${{ github.event.repository.name }}/"
          --no-web-resources-cdn

      - uses: actions/upload-pages-artifact@v3
        with:
          path: controle_financeiro/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
