<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!--
    O Flutter troca $FLUTTER_BASE_HREF pelo valor de --base-href no build.
    Na raiz de um domínio fica "/"; em GitHub Pages fica "/NOME-DO-REPOSITORIO/".
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Controle Financeiro: entradas, saídas, categorias, recorrências e gráficos. Seus dados ficam só no seu aparelho.">
  <meta name="theme-color" content="#201D4D">
  <meta name="color-scheme" content="light">

  <!-- iOS: abrir como app quando adicionado à Tela de Início -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Meu Financeiro">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <title>Meu Financeiro</title>

  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #F6F7FB;
      /* evita "puxar para recarregar" e o efeito elástico da página inteira */
      overscroll-behavior: none;
    }

    /* Tela de abertura enquanto o Flutter carrega */
    #abertura {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      background: #F6F7FB;
      transition: opacity .25s ease;
    }
    #abertura.saindo { opacity: 0; pointer-events: none; }
    #abertura img { width: 96px; height: 96px; }
    #abertura .roda {
      width: 28px;
      height: 28px;
      border: 3px solid #E5E7EE;
      border-top-color: #2E2A6E;
      border-radius: 50%;
      animation: gira .8s linear infinite;
    }
    @keyframes gira { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="abertura" aria-hidden="true">
    <img src="icons/Icon-192.png" alt="">
    <div class="roda"></div>
  </div>

  <script>
    // Some com a tela de abertura quando o app Flutter desenha o primeiro quadro.
    (function () {
      var el = document.getElementById('abertura');
      var removida = false;
      function remover() {
        if (removida || !el) return;
        removida = true;
        el.classList.add('saindo');
        setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 300);
      }
      window.addEventListener('flutter-first-frame', remover);
      // Rede de segurança: nunca deixar a abertura cobrindo o app.
      setTimeout(remover, 20000);
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
